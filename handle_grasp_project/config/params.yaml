vision_grasp_node:
  ros__parameters:
    # ==========================================
    # 1. 抓取位姿补偿 (单位: 毫米 mm / 度 °)
    # ==========================================
    offset_x: 0.0
    offset_y: 0.0
    offset_z: 240.0      # 悬停/抓取的安全高度补偿
    offset_rz: -40.0     # 夹爪在 Z 轴的旋转微调偏差

    # 强制抓取姿态 (直接透传给机械臂，防止视觉算出的姿态乱翻转)
    fixed_rx: -180.0      # 180度通常代表法奥机械臂夹爪垂直朝下
    fixed_ry: -0.0

    # ==========================================
    # 2. ArUco 二维码高精度识别参数
    # ==========================================
    marker_length: 0.05  # 严格注意：单位是米(m)。50mm 的码必须写 0.05

    # ==========================================
    # 3. 3D 点云处理参数 (PCD)
    # ==========================================
    voxel_size: 0.005          # 降采样体素大小 (0.005 = 5mm，越小越精细但越卡)
    outlier_neighbors: 20      # 统计滤波：评估周围多少个点
    outlier_std_ratio: 1.5     # 统计滤波：标准差倍数 (越小过滤越严格，容易切碎把手)